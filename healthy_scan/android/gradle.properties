# Set JVM memory allocation to prevent out-of-memory issues
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Enable AndroidX and Jetifier for compatibility with modern libraries
android.useAndroidX=true
android.enableJetifier=true

# Specify the NDK version (Ensure it's correctly installed in your SDK)
android.ndkVersion=27.0.12077973

# Ensure Gradle uses the correct Java version
org.gradle.java.home=C:/Program Files/Java/jdk-17

# Set Kotlin version explicitly to avoid conflicts
kotlin.version=1.9.20
